[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "database-tycoon"
version = "0.1.11"
description = "Tycoon CLI — local-first analytics CLI that adapts to your existing data stack"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Database Tycoon Team"}]
requires-python = ">=3.12,<3.14"
keywords = ["data", "analytics", "duckdb", "dbt", "dlt", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    "typer==0.27.0",
    "rich==15.0.0",
    "dbt-core==1.12.0",
    "dbt-duckdb==1.10.1",
    "dlt[duckdb]==1.26.0",
    # Nothing in src/ imports pandas, but dlt's filesystem source
    # (downloaded on demand via `dlt init`) needs it for its CSV
    # reader — tests/test_e2e_demo_arc.py fails without it. Optional-
    # extra treatment tracked in #148.
    "pandas==3.0.3",
    "duckdb==1.5.2",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "pydantic==2.13.3",
    "ruamel-yaml==0.19.1",
    # The city renderer's SQL lineage. This is a floor, not a new install:
    # dbt-core (via metricflow) and dlt both depend on sqlglot already, so
    # every install has carried it regardless. Declaring it here states the
    # version the renderer needs instead of inheriting whatever those two
    # happen to resolve to. It is deliberately not an extra -- an extra can
    # only add *distributions*, never gate files out of this wheel, and
    # tycoon_city ships inside it, so `[city]` would have installed nothing
    # and advertised a choice the user does not actually have.
    "sqlglot>=30.15.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.5.49",
]

[project.urls]
Homepage = "https://github.com/Database-Tycoon/tycoon-cli"
Repository = "https://github.com/Database-Tycoon/tycoon-cli"
Issues = "https://github.com/Database-Tycoon/tycoon-cli/issues"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov>=7.1.0",
    "syrupy==5.2.0",
    "ruff==0.15.20",
]

[project.scripts]
tycoon = "tycoon.cli:app"

[tool.hatch.build.targets.wheel]
# Non-Python files inside tycoon_city ship too, and three things depend on it:
# the built web bundle (`web_dist/`), the themes (`themes/*` — spritesheet plus
# theme.toml) and the demo's OSI model (`demo/semantic.yml`). A data file that
# does not ship is the classic version of this bug.
packages = ["src/tycoon", "src/tycoon_city"]

[tool.uv]
prerelease = "if-necessary-or-explicit"

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that require network or external services (opt-in: `pytest -m e2e`). Skipped by default.",
    "offline_e2e: full-pipeline tests that run entirely offline (init + ingest + transform). Included in the default run so CI gates on real integration, not just unit tests.",
    "recipe: marker for recipe doctest blocks parsed from README / docs/recipes (`tests/test_recipe_doctests.py`). `mode=offline` blocks run by default; `mode=online` blocks gate on `--run-online`.",
    "subprocess_e2e: subprocess-driven end-to-end tests that shell out to the installed `tycoon` binary (catches PATH / Rich rendering / packaging bugs that in-process tests can't see). Included in the default run.",
]
# tests/tycoon_city is the renderer's suite, carried over from the
# pipeline-city repo and REWIRED 2026-08-10 (import paths and parents[N]
# anchors re-pointed at this repo's root): CI now gates the renderer too.
# The only skips are the demo.duckdb-dependent golden tests — that fixture
# was never carried over, and regenerating the golden is a deliberate
# contract change tracked in docs/city/handover.md.
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# cli.py intentionally registers subcommands after the Typer app is
# constructed, which ruff flags as E402. The alternative is circular imports.
"src/tycoon/cli.py" = ["E402"]
# init.py re-exports moved symbols at the bottom of the file for backwards
# compatibility; they are intentionally placed after the module body.
"src/tycoon/commands/init.py" = ["E402"]
# Forward-reference string literals in type annotations trip F821 when the
# referenced name is imported inside the method body to avoid circular imports.
"tests/test_ingestion.py" = ["F821"]

[tool.coverage.run]
source = ["src/tycoon"]
branch = false

[tool.coverage.report]
# Floor re-baselined after dropping server/dagster/ask extras (v0.1.10).
# Removing that largely-untested code lifted the real ratio from ~65%
# to ~73%. Floor sits 5 points under baseline for routine-drift
# headroom (same margin as the old 65/60 split); raise it 1-2 points
# per release alongside genuine test additions.
fail_under = 68
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
