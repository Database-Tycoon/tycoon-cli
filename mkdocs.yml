site_name: Database Tycoon
site_description: A local-first analytics CLI for exploring any dataset.
site_url: https://database-tycoon.github.io/tycoon-cli/
repo_url: https://github.com/Database-Tycoon/tycoon-cli
repo_name: Database-Tycoon/tycoon-cli
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# Declared explicitly because `search` is the default plugin set: naming any
# plugin here replaces that default instead of extending it, so a plugin added
# without re-listing search would ship a site with no search and no error.
plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Database-Tycoon/tycoon-cli
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/database-tycoon/

nav:
  - Home: index.md
  - Getting started:
    - getting-started/installation.md
    - getting-started/first-project.md
    - getting-started/concepts.md
  - Commands:
    - Overview: commands/index.md
    - Project:
      - "tycoon init": commands/init.md
      - "tycoon setup": commands/setup.md
      - "tycoon register": commands/register.md
      - "tycoon profiles": commands/profiles.md
      - "tycoon semantics": commands/semantics.md
      - "tycoon doctor": commands/doctor.md
      - "tycoon docs": commands/docs.md
    - Data pipeline:
      - "tycoon data sources": commands/data/sources.md
      - "tycoon data transform": commands/data/transform.md
      - "tycoon data sync": commands/data/sync.md
      - "tycoon data query / schema / clean": commands/data/query.md
      - "tycoon data history": commands/data/history.md
      - "tycoon data analyze": commands/data/analyze.md
      - "tycoon data status": commands/data/status.md
      - "tycoon data run-all": commands/data/run-all.md
    - Services:
      - "tycoon start / stop": commands/start.md
      - "tycoon city": commands/city.md
    - Tools:
      - "tycoon run": commands/run.md
      - "tycoon notify": commands/notify.md
      - "tycoon schedule": commands/schedule.md
  - Recipes:
    - Full walkthroughs:
      - "CSV files to a live dashboard": recipes/csv-to-dashboard.md
      - "MotherDuck + local snapshot": recipes/motherduck-cloud-sync.md
    - Bring your own stack:
      - "An existing dbt project": recipes/existing-dbt-project.md
      - "An existing dbt profile": recipes/existing-dbt-profile.md
      - "Fivetran connector state": recipes/fivetran-metadata.md
    - Modelling and export:
      - "The layered architecture": recipes/layered-architecture.md
      - "Marts as portable OSI YAML": recipes/osi-export.md
  - Reference:
    - reference/tycoon-yml.md
    - reference/templates.md
    - reference/observability.md
    - reference/environment.md
    - reference/dependencies.md
    - "All commands + options": reference/all-commands.md
  - Releases:
    - releases/index.md
    - 0.2.x:
      - "v0.2.2": releases/v0.2.2.md
      - "v0.2.1": releases/v0.2.1.md
      - "v0.2.0": releases/v0.2.0.md
    - 0.1.x:
      - "v0.1.11": releases/v0.1.11.md
      - "v0.1.10": releases/v0.1.10.md
      - "v0.1.9": releases/v0.1.9.md
      - "v0.1.8": releases/v0.1.8.md
      - "v0.1.7": releases/v0.1.7.md
      - "v0.1.6": releases/v0.1.6.md
      - "v0.1.5": releases/v0.1.5.md
      - "v0.1.4": releases/v0.1.4.md
      - "v0.1.3": releases/v0.1.3.md
      - "v0.1.2": releases/v0.1.2.md
      - "v0.1.1": releases/v0.1.1.md

# A page in none of the three lists publishes silently: MkDocs reports an
# omitted file at INFO, so `--strict` stays green. `omitted_files: warn` turns
# that into a build failure, which is what makes the rule below enforceable
# rather than a convention (gh-348).
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn

# Contributor notes must stay out of the published site while staying readable
# locally. `tycoon docs serve` is how contributors read these docs, and
# `CLAUDE.md` routes every city-renderer task to `docs/city/conventions.md`
# and `handover.md`.
#
# `draft_docs` is the key that draws that line: MkDocs drops a DRAFT file from
# `mkdocs build` but still populates it under `mkdocs serve`, where
# `exclude_docs` stops processing the file in both. Keeping them out of `nav`
# was not enough on its own: MkDocs still built them, served them at guessable
# URLs, and indexed them for search (gh-348).
draft_docs: |
  /city/
  /proposals/

# These three are not documentation in either mode, so they are excluded
# outright rather than drafted: a PyPI publishing runbook, an OpenMetadata
# note, and a shell script.
exclude_docs: |
  /openmetadata.md
  /publishing-to-pypi.md
  /install_rill.sh

# `ingestion-architecture.md` is published but deliberately out of nav: it
# describes the ingestion architecture being built toward rather than shipped
# behaviour, and two release notes link to it, three times in all. Whether it
# earns a nav entry of its own is an open question on gh-348.
not_in_nav: |
  /ingestion-architecture.md
