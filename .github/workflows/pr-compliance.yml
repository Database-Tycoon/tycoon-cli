name: PR Compliance

# Enforces the PR guardrails described in CONTRIBUTING.md:
#   - size:  at most 8 counted files per PR, template bundles and
#            release-promotion branches exempt, plus a 500-line cap on
#            newly added src/**/*.py files (scripts/pr_size_check.py,
#            configured in .github/pr-size.yml)
#   - title: `type(scope): description`, every type must carry a gh-<N>
#            scope, chore/ci included (scripts/pr_title_check.py,
#            configured in .github/pr-title.yml)
#
# Behaviour (warn vs fail) for each check is controlled independently by
# `mode:` in its own config file. The optional PR_SIZE_MODE / PR_TITLE_MODE
# repository variables override it without a commit.
#
# Both jobs run their check script and config from the PR's base ref, not
# the PR's own checkout, fetched via `git show` into a `trusted/` subdir
# below. Otherwise a PR could raise its own limits by editing
# .github/pr-size.yml or the scripts themselves -- harmless while mode is
# warn, but load-bearing once a check flips to fail. `trusted/` lives
# inside the same checkout (not a separate `actions/checkout`) so the
# script's internal `git merge-base`/`git diff`/`git show` calls still
# resolve against the one clone that actually has both the base and head
# commits (fetch-depth: 0 below).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-compliance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch trusted check code from the base ref
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p trusted/.github trusted/scripts
          # Falls back to the PR's own script only when the base ref predates
          # this workflow (e.g. this very PR, before it first merges to main).
          if ! git show "$BASE_SHA:scripts/pr_size_check.py" > trusted/scripts/pr_size_check.py 2>/dev/null; then
            cp scripts/pr_size_check.py trusted/scripts/pr_size_check.py
          fi
          if ! git show "$BASE_SHA:.github/pr-size.yml" > trusted/.github/pr-size.yml 2>/dev/null; then
            rm -f trusted/.github/pr-size.yml
          fi

      - name: Run PR size check
        id: check
        working-directory: trusted
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_SIZE_MODE: ${{ vars.PR_SIZE_MODE }}
          PR_SIZE_REPORT_FILE: ${{ github.workspace }}/pr-size-report.md
        run: python scripts/pr_size_check.py

      - name: Upsert PR comment
        # Fork PRs and Dependabot get a read-only GITHUB_TOKEN regardless of
        # the `permissions:` block above, so this step 403s under
        # set -euo pipefail and turns the warn-only check red. Skip it for
        # those; violations still surface via the job summary and inline
        # annotations. `ignore_authors` in pr-title.yml only skips the
        # title job's own report, not this comment step, so the guard is
        # needed here regardless.
        if: >
          always() && hashFiles('pr-size-report.md') != '' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- pr-size-check -->'
          { printf '%s\n\n' "$marker"; cat pr-size-report.md; } > body.md
          existing=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
              -F body=@body.md >/dev/null
            echo "updated comment $existing"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -F body=@body.md >/dev/null
            echo "created comment"
          fi

  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch trusted check code from the base ref
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p trusted/.github trusted/scripts
          if ! git show "$BASE_SHA:scripts/pr_title_check.py" > trusted/scripts/pr_title_check.py 2>/dev/null; then
            cp scripts/pr_title_check.py trusted/scripts/pr_title_check.py
          fi
          if ! git show "$BASE_SHA:.github/pr-title.yml" > trusted/.github/pr-title.yml 2>/dev/null; then
            rm -f trusted/.github/pr-title.yml
          fi

      - name: Run PR title check
        id: check
        working-directory: trusted
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE_MODE: ${{ vars.PR_TITLE_MODE }}
          PR_TITLE_REPORT_FILE: ${{ github.workspace }}/pr-title-report.md
        run: python scripts/pr_title_check.py

      - name: Upsert PR comment
        # See the size job's identical guard above: fork/Dependabot PRs get
        # a read-only token, so this step must be skipped for them.
        if: >
          always() && hashFiles('pr-title-report.md') != '' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- pr-title-check -->'
          { printf '%s\n\n' "$marker"; cat pr-title-report.md; } > body.md
          existing=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
              -F body=@body.md >/dev/null
            echo "updated comment $existing"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -F body=@body.md >/dev/null
            echo "created comment"
          fi
