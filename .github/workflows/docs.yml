name: Deploy docs

# Publishes the MkDocs site to GitHub Pages on every push to main.
#
# This does not rely on ci.yml having run. `main` has no branch protection and
# no rulesets, so no check is required to merge, and this workflow can be
# dispatched by hand. It therefore builds with --strict and runs the
# publishability check itself before uploading anything.
#
# Pages must be configured with "GitHub Actions" as its source for the deploy
# step to succeed. That is a repository setting, not a file in this repo; it
# was set on 2026-10-12, and `gh api repos/<owner>/<repo>/pages` reports
# `build_type: workflow` when it is right.

on:
  push:
    branches: [main]
  workflow_dispatch:

# No default grants - the deploy job holds the OIDC token (id-token: write),
# so keep the floor at zero and let the job ask for what it needs.
permissions: {}

# A push that lands while a deploy is in flight queues behind it instead of
# cancelling it. A cancelled deploy-pages run can leave the Pages deployment
# half-applied, which is worse than waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build + deploy (github pages)
    runs-on: ubuntu-latest
    # `workflow_dispatch` can be aimed at any ref carrying this file, and
    # deploying a feature branch over the live site is never wanted: the docs
    # publish when a release branch merges into main, and only then.
    if: github.ref == 'refs/heads/main'
    # `deploy-pages` polls for up to 10 minutes by default. A 5 minute budget
    # would cancel a slow rollout mid-deploy, which is the half-applied state
    # the concurrency group above exists to avoid.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync docs extra
        run: uv sync --extra docs

      - name: Build docs (strict)
        run: uv run mkdocs build --strict

      - name: Assert no internal pages were published
        run: uv run python scripts/check_docs_publishable.py

      - name: Upload the built site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
